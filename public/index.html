<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#E4E2DD">
<title>Bubble Arena</title>
<meta name="description" content="Paint the floor, own the arena. A top-down paint shooter for up to 15 players.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&family=DM+Sans:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed canvas arena; menus are DOM cards floating over a live bot match. Single light look (concrete floor). */
:root{
  --floor:#E4E2DD; --grid:#D6D3CC; --ink:#232A35; --muted:#4A5462; --panel:#FFFFFF; --rock:#8A97A6; --pink:#FF2D87; --alert:#B8125C; --dim:rgba(35,42,53,.42);
  --display:'Rubik','Arial Rounded MT Bold',system-ui,sans-serif; --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--floor);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:5}
.screen.dim{background:var(--dim)}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:18px;padding:24px;box-sizing:border-box;max-width:100%;margin:auto}
.title-card{width:440px;display:flex;flex-direction:column;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,56px);line-height:.95;margin:0;letter-spacing:.01em;text-align:center}
.logo span{color:var(--pink)}
.tag{margin:0 0 4px;text-align:center;color:var(--muted);font-size:16px}
.label,label{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.02em}
input[type=text]{height:48px;box-sizing:border-box;padding:0 14px;border:3px solid var(--ink);border-radius:12px;font:500 17px var(--body);color:var(--ink);background:var(--panel);width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{height:48px;border-radius:12px;border:3px solid var(--ink);background:var(--panel);color:var(--ink);font:500 15px var(--display);cursor:pointer}
.mode[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.btn{height:54px;padding:0 26px;border:3px solid var(--ink);border-radius:12px;background:var(--panel);color:var(--ink);font:500 18px var(--display);cursor:pointer}
.btn.primary{background:var(--pink);font-weight:800;font-size:21px}
.btn:disabled{opacity:.6;cursor:wait}
.btn:active,.mode:active{transform:translateY(1px)}
.play-row{display:grid;grid-template-columns:1fr;gap:8px}
.status{margin:0;text-align:center;font-size:14px;color:var(--muted);min-height:20px}
.status.err{color:var(--alert)}
.hint{margin:2px 0 0;font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
.wide{width:860px}
.wide h2{font:800 32px var(--display);margin:0}
.sub{margin:4px 0 16px;color:var(--muted)}
.clsmenu{position:fixed;z-index:4;left:50%;top:min(calc(50% + 64px*var(--k,1)), calc(100% - 210px*var(--k,1)));transform:translateX(-50%) scale(var(--k,1));transform-origin:top center;width:min(520px, calc((100vw - 32px)/var(--k,1)));background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:10px 12px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 0 5px rgba(255,45,135,.35);animation:menuPop .22s ease-out}
.clsmenu-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.clsmenu-head b{font:800 18px var(--display)}
.clsmenu-head span{font-size:13px;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pick{position:relative;border:3px solid var(--rock);border-radius:12px;background:var(--panel);padding:2px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--ink);font-family:var(--body);min-width:0;text-align:center}
.pick:hover,.pick:focus-visible{border-color:var(--ink);background:var(--floor)}
.pick canvas{width:64px;height:64px;pointer-events:none}
.pick b{font:800 15px var(--display)}
.pick small{font-size:12px;color:var(--muted);line-height:1.3}
.pick kbd{position:absolute;top:5px;left:6px;font:500 11px var(--body);color:var(--muted)}
@keyframes menuPop{from{opacity:0;transform:translateX(-50%) scale(calc(.88*var(--k,1)))}to{opacity:1;transform:translateX(-50%) scale(var(--k,1))}}
.results{width:900px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.res-map{flex:1 1 300px;min-width:0}
.res-map canvas{width:100%;height:auto;border:3px solid var(--ink);border-radius:14px;display:block;image-rendering:pixelated;background:var(--floor)}
.res-info{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.pill{align-self:flex-start;background:var(--ink);color:var(--panel);border-radius:999px;padding:6px 14px;font-size:15px}
.big{font:800 clamp(40px,8vw,64px) var(--display);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.5em;color:var(--muted);font-weight:500}
.split{height:26px;border:3px solid var(--ink);border-radius:13px;overflow:hidden;display:flex;background:var(--panel)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:3px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:13px;color:var(--muted)}
.tile b{font:800 clamp(20px,4vw,28px) var(--display);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.next{font:500 15px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.stats{position:fixed;z-index:3;left:calc(16px + env(safe-area-inset-left,0px));width:268px;max-width:calc((100vw - 32px)/var(--k,1));transform:scale(var(--k,1));transform-origin:left bottom;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
.stats-head{display:flex;justify-content:space-between;font:800 15px var(--display)}
.stats-head span:last-child{font:500 13px var(--body);color:var(--muted)}
.ptsbox{width:max-content}
.ptsbox .stats-head{white-space:nowrap;gap:10px}
#ptsCount{font:800 15px var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.ptsbar{display:grid;gap:3px}
.ptsbar i{height:10px;border-radius:3px;background:var(--floor)}
.ptsbar i.on{background:var(--pink)}
#statRows{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:96px 1fr 36px;align-items:center;gap:8px;font-size:13px}
.pips{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px}
.pips i{height:9px;border-radius:2px;background:var(--floor)}
.pips i.on{background:var(--ink)}
.plus{width:36px;height:28px;border:none;border-radius:8px;background:var(--pink);color:var(--ink);font:800 18px var(--display);cursor:pointer;padding:0}
.plus:disabled{background:var(--alert);color:rgba(255,255,255,.7);box-shadow:0 0 8px 1px rgba(184,18,92,.55);cursor:not-allowed}
.uisize{display:flex;align-items:center;gap:8px}.uisize span{flex:1;text-align:center;font:500 17px var(--display)}.uisize .btn{height:40px;width:56px;padding:0;font-size:22px}.uisize .btn:disabled{opacity:.35;cursor:default}
.pause-card{width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
.pause-card h2{font:800 32px var(--display);margin:0}
.pause-card .sub{margin:0 0 4px}
.leave{position:fixed;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none}
@media (max-width:520px){.pick small,.pick kbd{display:none}.clsmenu-head b{font-size:16px}.card{padding:18px}.stats{width:220px}.ptsbox{padding:8px 10px}.ptsbox .stats-head,#ptsCount{font-size:13px}.pts-word{display:none}.srow{grid-template-columns:78px 1fr 32px;font-size:12px}}
@media (prefers-reduced-motion:reduce){.btn:active,.mode:active{transform:none}.clsmenu{animation:none}}
</style>
</head>
<body>
<div id="safe"></div>
<canvas id="game" aria-label="Bubble Arena game"></canvas>

<div id="title" class="screen">
  <div class="card title-card">
    <h1 class="logo">BUBBLE <span>ARENA</span></h1>
    <p class="tag">Paint the floor. Own the arena.</p>
    <label for="nick">Nickname</label>
    <input id="nick" type="text" maxlength="16" placeholder="Enter a name" autocomplete="off">
    <div class="label">Mode</div>
    <div class="modes">
      <button id="mFfa" class="mode" aria-pressed="true">Free-for-all · 15</button>
      <button id="mTeams" class="mode" aria-pressed="false">Teams 5 v 5 v 5</button>
    </div>
    <div class="label">UI size</div>
    <div class="uisize" role="group" aria-label="UI size"><button class="btn uiDown" type="button" aria-label="Smaller UI">−</button><span class="uiVal">100%</span><button class="btn uiUp" type="button" aria-label="Bigger UI">+</button></div>
    <div class="play-row">
      <button id="playOnline" class="btn primary">Play online</button>
      <button id="playLocal" class="btn">Practice vs bots</button>
    </div>
    <p class="status" id="status" role="status"></p>
    <p class="hint" id="hint"></p>
  </div>
</div>

<div id="results" class="screen dim" hidden>
  <div class="card results">
    <div class="res-map"><canvas id="resMap" width="360" height="216" aria-label="Final paint map"></canvas></div>
    <div class="res-info">
      <span id="winPill" class="pill"></span>
      <div id="bigLine" class="big"></div>
      <div id="splitBar" class="split"></div>
      <div class="tiles">
        <div class="tile"><span>You painted</span><b id="tArea"></b></div>
        <div class="tile"><span>Splats</span><b id="tSplats"></b></div>
        <div class="tile"><span>Points earned</span><b id="tPts"></b></div>
      </div>
      <div class="row">
        <button id="again" class="btn primary">Play again</button>
        <button id="menu" class="btn">Main menu</button>
        <span id="nextNote" class="next" hidden></span>
      </div>
    </div>
  </div>
</div>

<div id="pause" class="screen dim" hidden>
  <div class="card pause-card" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
    <h2 id="pauseTitle">Paused</h2>
    <p class="sub" id="pauseNote"></p>
    <div class="play-row">
      <button id="resume" class="btn primary">Resume</button>
      <button id="quit" class="btn">Main menu</button>
    </div>
    <button id="soundBtn" class="btn" aria-pressed="true">Sound: on</button>
    <div class="label">UI size (- and = keys)</div>
    <div class="uisize" role="group" aria-label="UI size"><button class="btn uiDown" type="button" aria-label="Smaller UI">−</button><span class="uiVal">100%</span><button class="btn uiUp" type="button" aria-label="Bigger UI">+</button></div>
  </div>
</div>

<div id="clsMenu" class="clsmenu" role="group" aria-labelledby="clsMenuTitle" hidden>
  <div class="clsmenu-head"><b id="clsMenuTitle">Choose your class</b><span id="clsMenuNote"></span></div>
  <div class="picks" id="clsCards"></div>
</div>

<div id="ptsBox" class="stats ptsbox" role="status" hidden>
  <div class="stats-head"><span>Upgrade</span><span id="ptsCount"></span></div>
  <div class="ptsbar" id="ptsBar" aria-hidden="true"></div>
</div>

<div id="stats" class="stats" hidden>
  <div class="stats-head"><span id="statsTitle">Upgrades</span><span id="ptsLeft"></span></div>
  <div id="statRows"></div>
</div>

<script type="module">
import * as S from '/shared/sim.js';
const {WW, WH, CELL, GW, GH, PCOL, PNAME, TCOL, TNAME, CLASSES, CLASS_LIST, CLASS_KEYS, OBJ, OBJ_TYPES} = S;
const $ = id => document.getElementById(id);
const BUILD = '__BUILD__';   // filled in by the server; an open tab with older code reloads itself
const outdated = b => b && BUILD !== '__BUILD' + '__' && b !== BUILD;
const cv = $('game'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, SAFE = {t:0,r:0,b:0,l:0};
const PS = 0.5, INTERP = 100;
const INK = '#232A35', FLOOR = '#E4E2DD', GRIDC = '#D6D3CC', ROCK = '#8A97A6', MUTED = '#4A5462', WHITE = '#FFFFFF', OUTSIDE = '#CFCBC3', ALERT = '#B8125C';
const FD = 'Rubik, system-ui, sans-serif', FB = "'DM Sans', system-ui, sans-serif";
const SPLAT = new Path2D(S.SPLAT_PATH);
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
function darken(h, f){ f = f || 0.6; const n = parseInt(h.slice(1),16); const r = Math.round((n>>16&255)*f), g = Math.round((n>>8&255)*f), b = Math.round((n&255)*f); return '#' + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }
function rgbOf(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function fmtTime(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function lerpAngle(a, b, u){ let d = b - a; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2; return a + d*u; }

/* ---------- settings ---------- */
const settings = {nick:'', mode:'ffa', ui:1};
try { const s = JSON.parse(localStorage.getItem('splatter-settings') || '{}'); if (s.nick) settings.nick = String(s.nick).slice(0,16); if (s.mode==='teams') settings.mode = 'teams'; if (s.ui >= 0.5 && s.ui <= 1.2) settings.ui = s.ui; } catch(e) {}
function saveSettings(){ try { localStorage.setItem('splatter-settings', JSON.stringify(settings)); } catch(e) {} }

/* ---------- paint layer ---------- */
const paintCv = document.createElement('canvas'); paintCv.width = WW*PS; paintCv.height = WH*PS;
const pctx = paintCv.getContext('2d');
const ownerColor = (mode, o) => mode === 'teams' ? (TCOL[o] || FLOOR) : PCOL[o];
const tankColor = (mode, t) => mode === 'teams' ? TCOL[t.team] : PCOL[t.slot];
function drawStamp(mode, x, y, r, owner, rot){
  const col = ownerColor(mode, owner);
  pctx.save(); pctx.translate(x*PS, y*PS); pctx.rotate(rot); const sc = r/44*PS; pctx.scale(sc,sc); pctx.fillStyle = col; pctx.fill(SPLAT); pctx.restore();
  if (r >= 40){
    pctx.fillStyle = col;
    const n = 2 + Math.floor(Math.random()*3);
    for (let q=0;q<n;q++){ const a = rand(0,Math.PI*2), dd = r*rand(1.05,1.3), rr = r*rand(0.08,0.18); pctx.beginPath(); pctx.arc((x+Math.cos(a)*dd)*PS, (y+Math.sin(a)*dd)*PS, rr*PS, 0, Math.PI*2); pctx.fill(); }
  }
}
function paintFromGrid(mode, grid){
  pctx.clearRect(0,0,paintCv.width,paintCv.height);
  const c = CELL*PS;
  for (let o=1;o<16;o++){
    pctx.fillStyle = ownerColor(mode, o); pctx.beginPath(); let any = false;
    for (let j=0;j<GH;j++) for (let i=0;i<GW;i++){ if (grid[j*GW+i] !== o) continue; any = true; const x = (i+0.5)*c, y = (j+0.5)*c; pctx.moveTo(x + c*0.85, y); pctx.arc(x, y, c*0.85, 0, Math.PI*2); }
    if (any) pctx.fill();
  }
}

/* ---------- sessions ---------- */
// session.kind: 'demo' (bots behind the menu), 'local' (practice vs bots), 'net' (online)
let session = null;
const FX = {rings:[], hits:[], feed:[], toast:null, shake:0};
function resetFX(){ FX.rings = []; FX.hits = []; FX.feed = []; FX.toast = null; FX.shake = 0; }

function startLocal(kind, mode){
  closeNet();
  pctx.clearRect(0,0,paintCv.width,paintCv.height); resetFX();
  const s = {kind, mode, myId:0, acc:0, specialQ:false};
  s.sim = S.createSim({mode,
    onStamp: (x,y,r,o,rot) => drawStamp(mode, x, y, r, o, rot),
    onEvent: e => { if (s === session) handleEvent(e, s.myId); }});
  if (kind === 'local'){ const t = s.sim.addHuman({name: settings.nick || 'You'}); s.myId = t.id; }
  s.follow = null; s.camT = 0;
  session = s;
  const me = s.myId ? s.sim.getTank(s.myId) : s.sim.G.tanks[0];
  cam.x = me.x; cam.y = me.y;
}

function closeNet(){ if (session && session.kind === 'net' && session.ws){ session.closing = true; try { session.ws.close(); } catch(e) {} } }

function startNet(mode){
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  let ws;
  try { ws = new WebSocket(proto + location.host + '/ws'); } catch(e){ setStatus('Online play needs the game server. Try Practice vs bots.', true); return; }
  setStatus('Connecting to the game server…'); $('playOnline').disabled = true;
  const s = {kind:'net', mode, ws, myId:0, grid:new Uint8Array(GW*GH), counts:new Int32Array(16), paintable:1, obstacles:[], roster:new Map(),
             snaps:[], queue:[], offset:null, phase:'wait', time:S.MATCH, Y:null, meDisp:null, specialQ:false, joined:false, endAt:0};
  const timeout = setTimeout(() => { if (!s.joined){ setStatus('The server is waking up. This can take up to a minute on the free plan. Try again shortly.', true); $('playOnline').disabled = false; s.closing = true; try { ws.close(); } catch(e) {} } }, 15000);
  ws.onopen = () => ws.send(JSON.stringify({t:'join', mode, name: settings.nick || 'Player'}));
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch(e){ return; } onNet(s, m, timeout); };
  ws.onclose = () => {
    clearTimeout(timeout); $('playOnline').disabled = false;
    if (s.closing) return;
    if (session === s){ toTitle(); setStatus(s.joined ? 'Lost connection to the game server. Press Play online to rejoin.' : 'Could not reach the game server. Try again, or practise vs bots.', true); }
  };
}

function onNet(s, m, timeout){
  if (m.type === 'match' && outdated(m.build)){ s.closing = true; try { s.ws.close(); } catch(e) {} setStatus('The game was updated. Loading the new version…'); setTimeout(() => location.reload(), 400); return; }
  if (m.type === 'match'){
    if (!s.joined){
      clearTimeout(timeout); s.joined = true; $('playOnline').disabled = false; setStatus('');
      closeNet(); session = s; hideAllScreens(); resetFX(); statsKey = '';
    }
    s.myId = m.you; s.mode = m.mode; s.obstacles = m.obstacles;
    S.decodeGrid(m.grid, s.grid); s.counts = Int32Array.from(m.counts); s.paintable = m.paintable;
    s.roster = new Map(m.roster.map(r => [r.id, r])); s.snaps = []; s.queue = []; s.phase = m.phase; s.time = m.time; s.meDisp = null;
    paintFromGrid(s.mode, s.grid);
    $('results').hidden = true;
    if (m.phase === 'end'){ s.endAt = performance.now() + m.endT*1000; FX.toast = {text:'Next match starts soon', t:3}; }
    return;
  }
  if (m.type === 'snap'){
    const now = performance.now();
    const est = m.t - now;
    if (s.offset === null) s.offset = est; else s.offset = est < s.offset ? s.offset*0.7 + est*0.3 : s.offset + (est - s.offset)*0.02;
    const snap = {t:m.t, tanks:new Map(), bullets:new Map(), objects:new Map(), bombs:m.M, recv:now};
    for (const a of m.T) snap.tanks.set(a[0], a);
    for (const a of m.B) snap.bullets.set(a[0], a);
    for (const a of m.O) snap.objects.set(a[0], a);
    s.snaps.push(snap); if (s.snaps.length > 30) s.snaps.shift();
    if (m.R) s.roster = new Map(m.R.map(r => [r.id, r]));
    s.counts = Int32Array.from(m.C); s.time = m.tm; s.Y = m.Y; s.lastSnap = snap;
    s.phase = m.ph;
    const E = m.E.concat(netShots(s, m));
    if (m.P.length || E.length) s.queue.push({t:m.t, P:m.P, E});
    return;
  }
  if (m.type === 'error'){ setStatus(m.text, true); }
}

function processNetQueue(s, rt){
  while (s.queue.length && s.queue[0].t <= rt){
    const q = s.queue.shift();
    for (let i=0;i<q.P.length;i+=5){ const x=q.P[i], y=q.P[i+1], r=q.P[i+2], o=q.P[i+3], rot=q.P[i+4]/1000; S.stampGrid(s.grid, null, x, y, r, o, rot); drawStamp(s.mode, x, y, r, o, rot); }
    for (const e of q.E) handleEvent(e, s.myId);
  }
}

/* ---------- sound ---------- */
// name: [volume, number of takes]. Shots rotate between takes so rapid fire never repeats the exact same clip
const SFX = {'shot-splat':[0.36,3], 'shot-roller':[0.32,2], 'shot-bomber':[0.38,2], 'shot-liner':[0.3,2], 'shot-sprayer':[0.26,2],
  splash:[0.3,1], hit:[0.4,2], splatted:[0.6,1], kill:[0.45,1], levelup:[0.42,1], upgrade:[0.45,2], end:[0.35,1]};
// 3D placement in world pixels: world x → audio x, world y → audio z, the listener hangs LH above the camera facing screen-up.
// Full level within REF, then 1/distance fall-off; others' sounds also fade to nothing between FADE and FAR (just past the screen edge to about two screens away).
const AUD = {REF:400, ROLL:1, LH:240, FADE:1000, FAR:1700, MASTER:0.23};

  }

  // DOM panels follow the canvas HUD scale on desktop (--k), so browser zoom doesn't resize them relative to the arena
  const k = coarse ? settings.ui : +u.toFixed(3); if (hudK !== k){ hudK = k; document.documentElement.style.setProperty('--k', String(k)); }
  ptsBox.style.minWidth = Math.round(iw/k) + 'px';   // at least as wide as the HUD panel below, wider if its text needs it
  if (touchCtl.used && p.cls !== 'rookie'){
    const sb = specialBtn(); ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r, 0, Math.PI*2); ctx.fillStyle = p.specialCd > 0 ? FLOOR : '#FF2D87'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    if (p.specialCd > 0){ ctx.beginPath(); ctx.moveTo(sb.x, sb.y); ctx.arc(sb.x, sb.y, sb.r - 4, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1 - p.specialCd/(8*(1 - 0.10*(p.stats ? S.up(p, 'scd') : 0))))); ctx.closePath(); ctx.fillStyle = 'rgba(35,42,53,.18)'; ctx.fill(); }
    text(C.spec, sb.x, sb.y, '800 13px ' + FD, INK, 'center', 'middle');
  }
  for (const s of [touchCtl.left, touchCtl.right]){ if (!s) continue; ctx.globalAlpha = 0.5; ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.beginPath(); ctx.arc(s.ox, s.oy, 60, 0, Math.PI*2); ctx.stroke(); const dx = s.x - s.ox, dy = s.y - s.oy, l = Math.hypot(dx,dy), k = l > 60 ? 60/l : 1; ctx.beginPath(); ctx.arc(s.ox + dx*k, s.oy + dy*k, 24, 0, Math.PI*2); ctx.fillStyle = INK; ctx.fill(); ctx.globalAlpha = 1; }
  if (p.dead){
    const str = (p.killedBy ? 'Splatted by ' + p.killedBy : 'Splatted') + ' · back in ' + Math.max(0, p.respawnT).toFixed(1) + ' s';
    ctx.font = '800 ' + Math.round(20*u) + 'px ' + FD; const w = ctx.measureText(str).width + 36*u;
    ctx.fillStyle = INK; rr(ctx, cx - w/2, VH/2 - 26*u, w, 52*u, 26*u); ctx.fill();
    text(str, cx, VH/2, ctx.font, WHITE, 'center', 'middle');
  } else if (!V.wait && V.time <= 10 && V.time > 0){
    text(String(Math.ceil(V.time)), cx, VH/2 - 120*u, '800 ' + Math.round(96*u) + 'px ' + FD, 'rgba(35,42,53,.35)', 'center', 'middle');
  }
  if (FX.toast){ ctx.globalAlpha = Math.min(1, FX.toast.t*2); text(FX.toast.text, cx, VH*0.3, '800 ' + Math.round(26*u) + 'px ' + FD, INK, 'center', 'middle'); ctx.globalAlpha = 1; }
}

/* ---------- DOM: stats panel ---------- */
const statsBox = $('stats'), statRows = $('statRows');
let statsKey = '', statsCls = '';
function buildStatRows(cls){
  statsCls = cls; const C = CLASSES[cls];
  $('statsTitle').textContent = C.label + ' upgrades';
  statRows.innerHTML = C.ups.map((u,i) => '<div class="srow"><span>' + u[1] + '</span><div class="pips">' + '<i></i>'.repeat(8) + '</div><button class="plus" id="up' + i + '" aria-label="Upgrade ' + u[1] + '" title="Key ' + (i+1) + '">+</button></div>').join('');
  for (let i=0;i<C.ups.length;i++) $('up' + i).addEventListener('click', e => { e.stopPropagation(); sendUpgrade(i); });
}
buildStatRows('rookie');
// before you can afford an upgrade, a small counter shows points towards the next one (e.g. 3 / 10)
const ptsBox = $('ptsBox'), ptsBar = $('ptsBar');
let hudK = 1;
let ptsKey = '';
function syncPoints(p, statsShown){
  const show = !!(p && p.stats && !p.dead && !p.classPending && !statsShown && p.stats.some(v => v < 8));
  if (ptsBox.hidden === show) ptsBox.hidden = !show;
  if (!show) return;
  const cost = S.upgradeCost(p), have = Math.min(p.points, cost), key = have + '/' + cost;
  if (key === ptsKey) return; ptsKey = key;
  $('ptsCount').innerHTML = have + ' / ' + cost + '<span class="pts-word"> points</span>';
  if (ptsBar.children.length !== cost){ ptsBar.style.gridTemplateColumns = 'repeat(' + cost + ',minmax(0,1fr))'; ptsBar.innerHTML = '<i></i>'.repeat(cost); }
  [...ptsBar.children].forEach((pip, k) => pip.classList.toggle('on', k < have));
}
let upSeen = {cls:null, n:0};
function syncStats(){
  const p = session && session.kind !== 'demo' && $('results').hidden && $('pause').hidden && V ? V.me : null;
  if (p && p.stats){ const n = p.stats.reduce((a,b) => a+b, 0); if (p.cls === upSeen.cls && n > upSeen.n) sfx('upgrade'); upSeen = {cls:p.cls, n}; }
  const show = !!(p && p.stats && !p.dead && !p.classPending && p.points >= S.upgradeCost(p) && p.stats.some(v => v < 8));
  if (statsBox.hidden === show) statsBox.hidden = !show;
  syncPoints(p, show);
  if (!show) return;
  if (p.cls !== statsCls){ buildStatRows(p.cls); statsKey = ''; }
  const key = p.cls + '|' + p.points + '|' + p.stats.join(',');
  if (key === statsKey) return; statsKey = key;
  $('ptsLeft').textContent = p.points + ' points';
  statRows.querySelectorAll('.srow').forEach((row,i) => { row.querySelectorAll('i').forEach((pip,k) => pip.classList.toggle('on', k < p.stats[i])); $('up' + i).disabled = p.stats[i] >= 8; });
}

/* ---------- DOM: class menu (pops up after 5 upgrades; you keep playing) ---------- */
const clsMenu = $('clsMenu'), clsCards = $('clsCards');
let menuSentAt = -1e9;
function buildClassMenu(col){
  clsCards.innerHTML = '';
  $('clsMenuNote').textContent = touchCtl.used ? 'Keep playing · tap one' : 'Keep playing · click or press 1–4';
  CLASS_KEYS.forEach((k, i) => {
    const C = CLASSES[k];
    const b = document.createElement('button'); b.className = 'pick'; b.type = 'button'; b.title = C.desc + '. ' + C.specLong + '.';
    const c = document.createElement('canvas'); c.width = 130; c.height = 130;
    b.appendChild(c);
    b.insertAdjacentHTML('beforeend', '<kbd>' + (i+1) + '</kbd><b>' + C.label + '</b><small>' + C.tag + '</small>');
    b.addEventListener('mousedown', e => e.stopPropagation());
    b.addEventListener('click', e => { e.stopPropagation(); chooseClass(k); });
    clsCards.appendChild(b);
    const g = c.getContext('2d');
    const ft = {x:60, y:94, aim:Math.PI/4, cls:k, slot:1, flash:0, moving:false, id:0};
    const draw = () => { g.clearRect(0, 0, 130, 130); drawPlayer(g, ft, {scale:1, lvl:3, color:col}); };
    const e = getSprite('SE', col, GUN_OF[k], 3, false, 0); if (e.ready) draw(); else e.cbs.push(draw);
  });
}
function chooseClass(k){ sendClass(k); menuSentAt = performance.now(); clsMenu.hidden = true; }
const menuOpen = () => !clsMenu.hidden;
function syncClassMenu(){
  const p = session && session.kind !== 'demo' && $('results').hidden && $('pause').hidden && V ? V.me : null;
  const show = !!(p && p.classPending && p.cls === 'rookie' && performance.now() - menuSentAt > 1200);
  if (show && clsMenu.hidden) buildClassMenu(tankColor(V.mode, p));
  if (clsMenu.hidden === show) clsMenu.hidden = !show;
}

/* ---------- DOM: results ---------- */
function showResults(){
  if (!V || !V.me) return;
  const p = V.me, sh = shares();
  const sorted = sh.slice().sort((a,b) => b.v - a.v);
  const pill = $('winPill'), big = $('bigLine'), bar = $('splitBar');
  if (V.mode === 'teams'){
    const win = sorted[0];
    pill.textContent = win.owner === p.team ? 'Your team wins' : win.name + ' team wins';
    big.innerHTML = pct(sh[0].v) + ' <small>vs ' + pct(sh[1].v) + ' vs ' + pct(sh[2].v) + '</small>';
    bar.innerHTML = sh.map(q => '<div style="width:' + (q.v*100).toFixed(2) + '%;background:' + q.color + '"></div>').join('');
  } else {
    const rank = sorted.findIndex(q => q.tank && q.tank.id === p.id) + 1;
    pill.textContent = rank === 1 ? 'You win' : sorted[0].name + ' wins';
    const mine = sh.find(q => q.tank && q.tank.id === p.id);
    big.innerHTML = pct(mine ? mine.v : 0) + ' <small>#' + rank + ' of ' + sh.length + '</small>';
    bar.innerHTML = sorted.map(q => '<div style="width:' + (q.v*100).toFixed(2) + '%;background:' + q.color + '"></div>').join('');
  }
  const m2 = (p.cellsPainted || 0)*(CELL/100)*(CELL/100);
  $('tArea').textContent = Math.round(m2).toLocaleString() + ' m²';
  $('tSplats').textContent = p.splats || 0;
  $('tPts').textContent = '+' + Math.round(p.pointsTotal || 0).toLocaleString();
  const rc = $('resMap'), rg = rc.getContext('2d'), img = rg.createImageData(GW,GH), d = img.data;
  const col = []; for (let o=0;o<16;o++) col[o] = o === 0 ? [255,255,255] : rgbOf(ownerColor(V.mode, o));
  for (let k=0;k<GW*GH;k++){ const v = V.grid[k], c = v === 255 ? [138,151,166] : (col[v] || col[0]); d[k*4] = c[0]; d[k*4+1] = c[1]; d[k*4+2] = c[2]; d[k*4+3] = 255; }
  rg.putImageData(img, 0, 0);
  const net = session.kind === 'net';
  $('again').hidden = net; $('nextNote').hidden = !net; $('menu').textContent = net ? 'Leave' : 'Main menu';
  if (net) session.endAt = performance.now() + 12000;
  $('pause').hidden = true; statsBox.hidden = true; ptsBox.hidden = true;
  $('results').hidden = false;
  setTimeout(() => (net ? $('menu') : $('again')).focus(), 50);
}

/* ---------- DOM: title ---------- */
const nick = $('nick'); nick.value = settings.nick;
nick.addEventListener('input', () => { settings.nick = nick.value.trim().slice(0,16); saveSettings(); });
function setMode(m){ settings.mode = m; saveSettings(); $('mFfa').setAttribute('aria-pressed', String(m === 'ffa')); $('mTeams').setAttribute('aria-pressed', String(m === 'teams')); }
$('mFfa').addEventListener('click', () => setMode('ffa')); $('mTeams').addEventListener('click', () => setMode('teams')); setMode(settings.mode);
const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
$('hint').textContent = coarse ? 'Left thumb moves. Right thumb aims and shoots. Tap the pink button for your class special.' : 'WASD to move · mouse to aim · click to shoot · Space for special · 1–6 to upgrade';
function setStatus(t, err){ const el = $('status'); el.textContent = t || ''; el.classList.toggle('err', !!err); }
function hideAllScreens(){ $('pause').hidden = true; $('title').hidden = true; $('results').hidden = true; mouse.down = false; touchCtl.left = touchCtl.right = null; }
function toTitle(){ closeNet(); clsMenu.hidden = true; $('pause').hidden = true; $('results').hidden = true; statsBox.hidden = true; ptsBox.hidden = true; $('title').hidden = false; startLocal('demo', 'ffa'); refreshOnline(); }
$('playOnline').addEventListener('click', () => startNet(settings.mode));
$('playLocal').addEventListener('click', () => { hideAllScreens(); setStatus(''); startLocal('local', settings.mode); statsKey = ''; });
nick.addEventListener('keydown', e => { if (e.key === 'Enter') startNet(settings.mode); });
$('again').addEventListener('click', () => { hideAllScreens(); startLocal('local', settings.mode); statsKey = ''; });
$('menu').addEventListener('click', toTitle);
function openPause(){
  if (!inGame()) return;
  keys.clear(); mouse.down = false; touchCtl.left = touchCtl.right = null;
  const net = session.kind === 'net';
  $('pauseNote').textContent = net ? 'Online matches keep going while you are paused. Your tank stands still.' : 'The match is frozen until you resume.';
  $('quit').textContent = net ? 'Leave match' : 'Main menu';
  $('pause').hidden = false;
  $('resume').focus();
}
function closePause(){ $('pause').hidden = true; keys.clear(); }
$('resume').addEventListener('click', closePause);
const UI_MIN = 0.5, UI_MAX = 1.2;
function setUI(v){
  settings.ui = Math.round(clamp(v, UI_MIN, UI_MAX)*10)/10; saveSettings();
  document.querySelectorAll('.uiVal').forEach(e => e.textContent = Math.round(settings.ui*100) + '%');
  document.querySelectorAll('.uiDown').forEach(b => b.disabled = settings.ui <= UI_MIN); document.querySelectorAll('.uiUp').forEach(b => b.disabled = settings.ui >= UI_MAX);
}
document.querySelectorAll('.uiDown').forEach(b => b.addEventListener('click', () => setUI(settings.ui - 0.1)));
document.querySelectorAll('.uiUp').forEach(b => b.addEventListener('click', () => setUI(settings.ui + 0.1)));
setUI(settings.ui);
$('soundBtn').addEventListener('click', () => setMuted(!audio.muted)); setMuted(audio.muted);
$('quit').addEventListener('click', toTitle);
async function refreshOnline(){
  if ($('title').hidden) return;
  try { const r = await fetch('/api/status', {cache:'no-store'}); if (!r.ok) return; const j = await r.json(); if (outdated(j.build)){ location.reload(); return; } if (!$('status').classList.contains('err')) setStatus(j.players === 1 ? '1 player online' : j.players + ' players online'); } catch(e) {}
}
setInterval(refreshOnline, 8000);

/* ---------- device input ---------- */
const inGame = () => session && session.kind !== 'demo' && $('results').hidden && $('pause').hidden;
window.addEventListener('keydown', e => {
  if (e.target === nick) return;
  if (e.code === 'Escape'){ if (!e.repeat){ if (!$('pause').hidden) closePause(); else openPause(); } return; }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code) && inGame()) e.preventDefault();
  if (e.code === 'Space' && !e.repeat) queueSpecial();
  if (e.code === 'KeyM' && !e.repeat) setMuted(!audio.muted);
  if ((e.code === 'Minus' || e.code === 'Equal') && !e.metaKey && !e.ctrlKey && !e.altKey && e.target !== nick) setUI(settings.ui + (e.code === 'Minus' ? -0.1 : 0.1));
  keys.add(e.code);
  if (inGame() && menuOpen() && /^Digit[1-4]$/.test(e.code)) chooseClass(CLASS_KEYS[Number(e.code.slice(5)) - 1]);
  else if (inGame() && /^Digit[1-6]$/.test(e.code)) sendUpgrade(Number(e.code.slice(5)) - 1);
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); mouse.down = false; });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
cv.addEventListener('mousedown', e => { if (e.button === 0){ mouse.down = true; mouse.active = true; mouse.x = e.clientX; mouse.y = e.clientY; } });
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('touchstart', e => {
  e.preventDefault(); touchCtl.used = true; mouse.active = false;
  for (const t of e.changedTouches){
    const x = t.clientX, y = t.clientY, sb = specialBtn();
    if (V && V.me && V.me.cls !== 'rookie' && Math.hypot(x - sb.x, y - sb.y) < sb.r + 8){ queueSpecial(); continue; }
    if (x < VW/2 && !touchCtl.left) touchCtl.left = {id:t.identifier, ox:x, oy:y, x, y};
    else if (!touchCtl.right) touchCtl.right = {id:t.identifier, ox:x, oy:y, x, y};
  }
}, {passive:false});
cv.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches){ for (const s of [touchCtl.left, touchCtl.right]) if (s && s.id === t.identifier){ s.x = t.clientX; s.y = t.clientY; } } }, {passive:false});
const endTouch = e => { for (const t of e.changedTouches){ if (touchCtl.left && touchCtl.left.id === t.identifier) touchCtl.left = null; if (touchCtl.right && touchCtl.right.id === t.identifier) touchCtl.right = null; } };
cv.addEventListener('touchend', endTouch); cv.addEventListener('touchcancel', endTouch);

/* ---------- loop ---------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2); VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW*DPR); cv.height = Math.round(VH*DPR);
  const cs = getComputedStyle($('safe')); SAFE = {t:parseFloat(cs.paddingTop)||0, r:parseFloat(cs.paddingRight)||0, b:parseFloat(cs.paddingBottom)||0, l:parseFloat(cs.paddingLeft)||0};
}
window.addEventListener('resize', resize); resize();

let lastT = performance.now();
const DT = 1/60;
function frame(now){
  if (innerWidth !== VW || innerHeight !== VH || Math.min(devicePixelRatio || 1, 2) !== DPR) resize();   // zoom or screen change without a resize event
  let el = (now - lastT)/1000; lastT = now; if (el > 0.25) el = 0.25;
  frameDt = el; clk += el;
  const s = session;
  if (s.kind !== 'net'){
    const me = s.myId ? s.sim.getTank(s.myId) : null;
    if (me){
      readInput(me);
      const playing = $('results').hidden && $('pause').hidden;
      s.sim.setInput(s.myId, {mx: playing ? input.mx : 0, my: playing ? input.my : 0, f: playing && input.fire, s: playing && s.specialQ, a: input.aim, d: input.aimDist});
      s.specialQ = false;
    }
    if (s.kind === 'local' && !$('pause').hidden) s.acc = 0; else s.acc += el;
    let n = 0;
    while (s.acc >= DT && n < 5){ s.sim.step(DT, s.kind === 'demo'); s.acc -= DT; n++; }
    if (n === 5) s.acc = 0;
  }
  V = buildView(now);
  if (s.kind === 'net' && V.me) readInput(V.me);
  // camera
  let f = V.me;
  if (s.kind === 'demo'){
    s.camT -= el;
    if (s.camT <= 0 || !s.follow || s.follow.dead){ const alive = V.tanks.filter(t => !t.dead); s.follow = alive[Math.floor(Math.random()*alive.length)]; s.camT = 9; }
    f = s.follow;
  }
  if (f){ const k = Math.min(1, el*(s.kind === 'demo' ? 1.5 : 10)); cam.x += (f.x - cam.x)*k; cam.y += (f.y - cam.y)*k; }
  listen();
  for (const r of FX.rings) r.t += el; FX.rings = FX.rings.filter(r => r.t < r.T);
  for (const h of FX.hits) h.t += el; FX.hits = FX.hits.filter(h => h.t < h.T);
  stepChips(el);
  for (const L of [POPS, OBJ_POPS]){ for (const p of L) p.t += el; for (let i = L.length - 1; i >= 0; i--) if (L[i].t >= L[i].T) L.splice(i, 1); }
  for (const q of FX.feed) q.t -= el; FX.feed = FX.feed.filter(q => q.t > 0);
  if (FX.toast){ FX.toast.t -= el; if (FX.toast.t <= 0) FX.toast = null; }
  FX.shake = Math.max(0, FX.shake - el);
  if (s.kind === 'net' && !$('results').hidden){ const left = Math.max(0, Math.ceil((s.endAt - now)/1000)); $('nextNote').textContent = left > 0 ? 'Next match in ' + left + ' s' : 'Starting…'; }
  render();
  syncStats();
  syncClassMenu();
  requestAnimationFrame(frame);
}
startLocal('demo', 'ffa');
refreshOnline();
requestAnimationFrame(frame);
</script>
</body>
